name: Oracle Always Free A1 Auto-Claimer

on:
  schedule:
    # Runs every 15 minutes, 24 hours a day in GitHub's cloud
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: oracle-claim
  cancel-in-progress: true

jobs:
  claim-oracle-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Set up OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI Credentials
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION || 'us-chicago-1' }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Attempt to Claim Always Free A1 Instance
        env:
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          echo "=== Starting Oracle A1 Auto-Claim in Chicago ==="
          
          # 1. Fetch Compartment ID
          COMPARTMENT_ID="${{ secrets.OCI_TENANCY }}"
          echo "Using Compartment: $COMPARTMENT_ID"

          # 2. Fetch Availability Domain
          AD=$(oci iam availability-domain list --query "data[0].name" --raw-output 2>/dev/null)
          echo "Availability Domain: $AD"

          # 3. Fetch Default Public Subnet
          SUBNET_ID=$(oci network subnet list --compartment-id "$COMPARTMENT_ID" --query "data[0].id" --raw-output 2>/dev/null)
          echo "Subnet: $SUBNET_ID"

          # 4. Fetch Ubuntu ARM Image
          IMAGE_ID=$(oci compute image list --compartment-id "$COMPARTMENT_ID" --operating-system "Canonical Ubuntu" --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output 2>/dev/null)
          echo "Image ID: $IMAGE_ID"

          # 5. Write Public SSH Key
          echo "${OCI_SSH_PUBLIC_KEY}" > /tmp/authorized_keys.pub

          # 6. Priority Check: 4/24 -> 2/12 -> 1/6
          echo "--- Checking Priority 1: 4 OCPUs & 24 GB RAM ---"
          RESULT=$(oci compute instance launch             --compartment-id "$COMPARTMENT_ID"             --availability-domain "$AD"             --shape "VM.Standard.A1.Flex"             --shape-config '{"ocpus": 4, "memoryInGBs": 24}'             --image-id "$IMAGE_ID"             --subnet-id "$SUBNET_ID"             --display-name "precise-reach"             --assign-public-ip true             --ssh-authorized-keys-file /tmp/authorized_keys.pub 2>&1 || true)

          if echo "$RESULT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "🎉🎉🎉 SUCCESS! Instance is PROVISIONING with 4 OCPUs & 24 GB RAM! 🎉🎉🎉"
            echo "$RESULT" | grep -E '"id"|"lifecycle-state"|"display-name"'
            exit 0
          fi

          echo "4/24 busy. Checking Priority 2: 2 OCPUs & 12 GB RAM..."
          RESULT2=$(oci compute instance launch             --compartment-id "$COMPARTMENT_ID"             --availability-domain "$AD"             --shape "VM.Standard.A1.Flex"             --shape-config '{"ocpus": 2, "memoryInGBs": 12}'             --image-id "$IMAGE_ID"             --subnet-id "$SUBNET_ID"             --display-name "precise-reach"             --assign-public-ip true             --ssh-authorized-keys-file /tmp/authorized_keys.pub 2>&1 || true)

          if echo "$RESULT2" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "🎉🎉🎉 SUCCESS! Instance is PROVISIONING with 2 OCPUs & 12 GB RAM! 🎉🎉🎉"
            echo "$RESULT2" | grep -E '"id"|"lifecycle-state"|"display-name"'
            exit 0
          fi

          echo "2/12 busy. Checking Priority 3: 1 OCPU & 6 GB RAM..."
          RESULT3=$(oci compute instance launch             --compartment-id "$COMPARTMENT_ID"             --availability-domain "$AD"             --shape "VM.Standard.A1.Flex"             --shape-config '{"ocpus": 1, "memoryInGBs": 6}'             --image-id "$IMAGE_ID"             --subnet-id "$SUBNET_ID"             --display-name "precise-reach"             --assign-public-ip true             --ssh-authorized-keys-file /tmp/authorized_keys.pub 2>&1 || true)

          if echo "$RESULT3" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "🎉🎉🎉 SUCCESS! Instance is PROVISIONING with 1 OCPU & 6 GB RAM! 🎉🎉🎉"
            echo "$RESULT3" | grep -E '"id"|"lifecycle-state"|"display-name"'
            exit 0
          fi

          echo "⏳ All slots currently occupied in Chicago. Next cloud run will recheck shortly."
          exit 0
